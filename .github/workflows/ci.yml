name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The module itself supports PHP 8.0+ (WHMCS 8.x). The test suite needs 8.1+
        # because PHPUnit 10/11 is the first release to support attribute-based tests,
        # and PHPUnit 9 silently reports "no tests found" rather than failing loudly.
        # PHP 8.0 compatibility of modules/ is asserted statically by the php-compat
        # job below (testVersion 8.0-), which does not need to run on 8.0 to check it.
        php: ['8.1', '8.2', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Unit tests
        run: vendor/bin/phpunit

      - name: Code style
        if: matrix.php == '8.4'
        run: vendor/bin/pint --test

      - name: PHP compatibility (8.0+)
        if: matrix.php == '8.4'
        run: composer php-compat
